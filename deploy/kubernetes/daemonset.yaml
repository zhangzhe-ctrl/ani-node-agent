apiVersion: v1
kind: Namespace
metadata:
  name: ani-node-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ani-node-agent
  namespace: ani-node-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ani-node-agent
  namespace: ani-node-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ani-node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ani-node-agent
    spec:
      serviceAccountName: ani-node-agent
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        ani.io/node-agent-enabled: "true"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ANI_NODE_AGENT_IMAGE_DIGEST_REQUIRED
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          env:
            - name: ANI_ACC_ENDPOINT
              value: ani-accelerator-service.ani-system.svc:9000
            - name: ANI_ACC_SERVER_DNS
              value: ani-accelerator-service
            - name: ANI_CONNECTION_REF
              value: OPERATOR_VERIFIED_CONNECTION_REF_REQUIRED
            - name: ANI_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ANI_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ANI_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: ANI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ANI_TLS_CERT_FILE
              value: /var/run/ani/tls/tls.crt
            - name: ANI_TLS_KEY_FILE
              value: /var/run/ani/tls/tls.key
            - name: ANI_TLS_CA_FILE
              value: /var/run/ani/tls/ca.crt
            - name: ANI_SA_TOKEN_FILE
              value: /var/run/ani/identity/token
            - name: ANI_STATE_DIRECTORY
              value: /var/lib/ani-node-agent
            - name: ANI_CRI_SOCKET
              value: /run/containerd/containerd.sock
            - name: ANI_POD_RESOURCES_SOCKET
              value: /var/lib/kubelet/pod-resources/kubelet.sock
            - name: ANI_SOURCE_FRESHNESS
              value: OPERATOR_MATCH_ACC_FRESHNESS_REQUIRED
            - name: ANI_JOURNAL_DIRECTORY
              value: /host/journal
            - name: ANI_MACHINE_ID_FILE
              value: /host/machine-id
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          volumeMounts:
            - name: identity
              mountPath: /var/run/ani/identity
              readOnly: true
            - name: tls
              mountPath: /var/run/ani/tls
              readOnly: true
            - name: state
              mountPath: /var/lib/ani-node-agent
            - name: cri
              # Keep replacement sockets visible after containerd restarts.
              mountPath: /run/containerd
              readOnly: true
            - name: pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
            - name: journal
              mountPath: /host/journal
              readOnly: true
            - name: machine-id
              mountPath: /host/machine-id
              readOnly: true
      volumes:
        - name: identity
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: ani-node-agent
                  expirationSeconds: 600
                  path: token
        - name: tls
          secret:
            secretName: ani-node-agent-mtls
            defaultMode: 0400
        - name: state
          hostPath:
            path: /var/lib/ani-node-agent
            type: DirectoryOrCreate
        - name: cri
          hostPath:
            path: /run/containerd
            type: Directory
        - name: pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory
        - name: journal
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
